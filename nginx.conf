# A landing é servida sob /alcance/ porque o Caddy da VPS repassa o caminho
# inteiro (reverse_proxy sem barra no fim). Os arquivos ficam em
# /usr/share/nginx/html/alcance/, de modo que o prefixo da URL e o do disco
# coincidem e nada depende de reescrita.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;
    # webp e woff2 já são comprimidos; recomprimir só gasta CPU.

    # A página não carrega nada de fora: nem fonte, nem script, nem imagem.
    # Sem estilo nem script embutido, a política dispensa 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Imagens e fontes têm nome estável, então uma semana de cache é segura e
    # trocar uma captura não exige o visitante limpar nada.
    location ~* ^/alcance/(img|fontes)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location /alcance/ {
        try_files $uri $uri/ /alcance/index.html;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Sonda para o compose e para o proxy, sem depender do prefixo.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Qualquer outra coisa não é deste contêiner.
    location / {
        return 404;
    }
}
